name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

# Least-privilege GITHUB_TOKEN: this workflow only builds and tests, it never
# writes to the repo. Explicit read-only scope silences the CodeQL
# "missing-workflow-permissions" alert.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cheap and first: a mistranslated glossary entry fails silently at
      # runtime, so it has to be caught here rather than by a user noticing a
      # process has no explanation in their language.
      - name: Check process glossary
        run: bash scripts/check-glossary.sh

      # -warnings-as-errors is the safety net: any new compiler warning fails CI.
      - name: Build (release, arm64)
        run: swift build -c release --arch arm64 -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -Xswiftc -warnings-as-errors
